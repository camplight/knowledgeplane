version: '3.9'
services:
  db:
    image: arangodb/arangodb:latest
    command: --experimental-vector-index
    environment:
      ARANGO_ROOT_PASSWORD: root
    ports: [ "8529:8529" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8529/_api/version || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dbdata:/var/lib/arangodb3

  mcp-server:
    build: ../apps/mcp-server
    environment:
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=knowledgeplane
      - ARANGO_USER=root
      - ARANGO_PASSWORD=root
      - PORT=8080
      - API_KEYS=DEV_API_KEY
    depends_on:
      db:
        condition: service_healthy
    ports: [ "8080:8080" ]
  
  webapp:
    build: ../apps/webapp
    environment:
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=knowledgeplane
      - ARANGO_USER=root
      - ARANGO_PASSWORD=root
      - NEXTAUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - MCP_SERVER_HOST=mcp-server
      - MCP_SERVER_PORT=8080
      - MCP_SERVER_PROTOCOL=http
      - MCP_SERVER_API_KEY=DEV_API_KEY
    depends_on:
      db:
        condition: service_healthy
    ports: [ "3000:3000" ]

  background-workers:
    build: ../apps/background-workers
    environment:
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=knowledgeplane
      - ARANGO_USER=root
      - ARANGO_PASSWORD=root
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  rest-api:
    build: ../apps/rest-api
    environment:
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=knowledgeplane
      - ARANGO_USER=root
      - ARANGO_PASSWORD=root
      - PORT=8081
    depends_on:
      db:
        condition: service_healthy
    ports: [ "8081:8081" ]

volumes:
  dbdata: {}
