version: "3.9"

services:
  db:
    image: arangodb:3.12.7
    command: --experimental-vector-index
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:?Set ARANGO_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/arangodb3
    restart: unless-stopped
    networks:
      - knowledgeplane
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8529/_api/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    image: ${DOCKER_REGISTRY:-knowledgeplane}/mcp-server:${IMAGE_VERSION:?Set IMAGE_VERSION to a pinned release}
    environment:
      - NODE_ENV=production
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-knowledgeplane}
      - ARANGO_USER=${ARANGO_USER:-kp}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:?Set ARANGO_PASSWORD}
      - PORT=8080
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET}
      - TOKEN_SIGNING_KEY=${TOKEN_SIGNING_KEY:?Set TOKEN_SIGNING_KEY}
      - ALLOW_SHARED_API_KEYS=false
      - APP_URL=${APP_URL:?Set APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-}
      - MICROSOFT_CLIENT_PRIVATE_KEY=${MICROSOFT_CLIENT_PRIVATE_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - UPLOADS_DIR=${UPLOADS_DIR:-./uploads}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - knowledgeplane

  webapp:
    image: ${DOCKER_REGISTRY:-knowledgeplane}/webapp:${IMAGE_VERSION:?Set IMAGE_VERSION to a pinned release}
    environment:
      - NODE_ENV=production
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-knowledgeplane}
      - ARANGO_USER=${ARANGO_USER:-kp}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:?Set ARANGO_PASSWORD}
      - APP_URL=${APP_URL:?Set APP_URL}
      - MCP_SERVER_URL=${MCP_SERVER_URL:?Set MCP_SERVER_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - knowledgeplane

  background-workers:
    image: ${DOCKER_REGISTRY:-knowledgeplane}/background-workers:${IMAGE_VERSION:?Set IMAGE_VERSION to a pinned release}
    environment:
      - NODE_ENV=production
      - ARANGO_URL=http://db:8529
      - ARANGO_DB_NAME=${ARANGO_DB_NAME:-knowledgeplane}
      - ARANGO_USER=${ARANGO_USER:-kp}
      - ARANGO_PASSWORD=${ARANGO_PASSWORD:?Set ARANGO_PASSWORD}
      - DATA_SOURCES_ENABLED=${DATA_SOURCES_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - knowledgeplane

  caddy:
    image: caddy:2.8
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp-server
      - webapp
    restart: unless-stopped
    networks:
      - knowledgeplane

volumes:
  dbdata:
  caddy_data:
  caddy_config:

networks:
  knowledgeplane:
    driver: bridge
