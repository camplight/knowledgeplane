# KnowledgePlane Benchmarks - Docker Container
#
# Prefer from repo root: npm run bench:quick | npm run bench:all
# (starts infra + API + workers, then invokes ./bench).
#
# The Python benchmark processes run via this compose file (see ./bench in tests/benchmarks/).
#
#   ./bench longmemeval              # Primary benchmark (LongMemEval)
#   ./bench hotpot -n 100            # HotpotQA
#   ./bench freshness                # Freshness benchmark
#   ./bench relationrecall -n 10     # RelationRecall
#   ./bench --help                   # All options

services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    image: kp-benchmarks:latest
    container_name: kp-bench
    volumes:
      - ./output:/app/output
      - ./runs:/app/runs
      - ./data:/app/data
      # Persist HuggingFace Hub, datasets, and sentence-transformers / torch caches.
      # Only mounting ./.cache/huggingface missed /root/.cache/torch, so MiniLM and
      # similar weights re-downloaded on every `docker compose run --rm`.
      - ./.cache:/root/.cache
      - ./src:/app/src:ro
    env_file:
      - ../../.env
      - ../../.env.benchmark
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      # Align all HF / transformers / hub downloads with the mounted volume (see volumes).
      - HF_HOME=/root/.cache/huggingface
      - HF_DATASETS_CACHE=/root/.cache/huggingface/datasets
      - HF_HUB_CACHE=/root/.cache/huggingface/hub
      - KP_API_URL=http://host.docker.internal:8081
      - ARANGO_URL=http://host.docker.internal:8529
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python3", "src/hotpotqa.py", "--n", "20", "--run_kp", "true", "--run_vector", "true"]
